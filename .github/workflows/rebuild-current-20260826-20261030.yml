name: 2026-08-26 이후 데이터·AI 분류·Pages 재구축

run-name: 8월 26일~10월 30일 데이터 검증·보완·재배포

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-current-20260826-20261030.yml"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
  GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash-lite' }}
  GEMINI_MAX_ATTEMPTS: "4"
  CONNECT_TIMEOUT_SECONDS: "15"
  READ_TIMEOUT_SECONDS: "30"
  HTTP_RETRY_TOTAL: "2"
  HTTP_BACKOFF_FACTOR: "1.5"
  KOREA_MOBILE_FALLBACK: "true"

concurrency:
  group: rebuild-current-20260826-20261030
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 최신 main 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: 패키지·코드 검증
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
          python -m py_compile collector/*.py
          node --check docs/assets/app.js

      - name: Gemini 설정 확인
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_KEY || secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo "::error::GEMINI_KEY 또는 GEMINI_API_KEY가 없습니다."; exit 1; }

      - name: 8월 26일~10월 16일 날짜 파일 누락 보완
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/missing_dates.txt
          from datetime import date, timedelta
          from pathlib import Path

          current = date(2026, 8, 26)
          end = date(2026, 10, 16)
          while current <= end:
              path = Path(f"docs/data/{current:%Y/%m/%d}/articles.json")
              if not path.exists():
                  print(current.isoformat())
              current += timedelta(days=1)
          PY

          if [[ -s /tmp/missing_dates.txt ]]; then
            echo "기존 구간 누락 날짜:"
            cat /tmp/missing_dates.txt
            while IFS= read -r day; do
              python -u -m collector.collect \
                --start-date "$day" \
                --end-date "$day" \
                --continue-on-error \
                --detail-workers 3 \
                --max-pages-per-day 10
            done < /tmp/missing_dates.txt
          else
            echo "8월 26일~10월 16일 날짜별 원본 파일 누락 없음"
          fi

      - name: 10월 17일~23일 보도자료 재수집
        run: |
          python -u -m collector.collect \
            --start-date "2026-10-17" \
            --end-date "2026-10-23" \
            --continue-on-error \
            --detail-workers 3 \
            --max-pages-per-day 10

      - name: 10월 24일~30일 보도자료 재수집
        run: |
          python -u -m collector.collect \
            --start-date "2026-10-24" \
            --end-date "2026-10-30" \
            --continue-on-error \
            --detail-workers 3 \
            --max-pages-per-day 10

      - name: 0건 날짜 파일 보완
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          from pathlib import Path
          import json

          current = date(2026, 8, 26)
          end = date(2026, 10, 30)
          created = []
          while current <= end:
              path = Path(f"docs/data/{current:%Y/%m/%d}/articles.json")
              if not path.exists():
                  path.parent.mkdir(parents=True, exist_ok=True)
                  payload = {
                      "schema_version": 2,
                      "date": current.isoformat(),
                      "source": "대한민국 정책브리핑 보도자료 HTML",
                      "articles": [],
                  }
                  path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  created.append(current.isoformat())
              current += timedelta(days=1)
          print("0건 날짜 보완:", ", ".join(created) if created else "없음")
          PY

      - name: 전체 데이터 Gemini 분류 검증·보완
        timeout-minutes: 80
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_KEY || secrets.GEMINI_API_KEY }}
        run: |
          python -u -m collector.classify_relevance_gemini \
            --data-dir docs/data \
            --model "$GEMINI_MODEL" \
            --batch-size 10 \
            --max-articles 20000 \
            --request-delay 3

      - name: Gemini 실패 건 대체 모델 재판정
        timeout-minutes: 60
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_KEY || secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gemini-fallback
          fallback_count=$(python - <<'PY'
          from pathlib import Path
          import json

          source_root = Path('docs/data')
          target_root = Path('/tmp/gemini-fallback')
          count = 0
          for source in source_root.glob('[0-9][0-9][0-9][0-9]/[0-9][0-9]/[0-9][0-9]/articles.json'):
              payload = json.loads(source.read_text(encoding='utf-8'))
              articles = []
              for article in payload.get('articles', []):
                  if article.get('ip_relevance', {}).get('method') == 'rules-fallback':
                      copied = dict(article)
                      copied.pop('ip_relevance', None)
                      articles.append(copied)
              if articles:
                  target = target_root / source.relative_to(source_root)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(json.dumps({
                      'schema_version': 2,
                      'date': payload.get('date'),
                      'articles': articles,
                  }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
                  count += len(articles)
          print(count)
          PY
          )
          echo "기본 모델 실패 건: ${fallback_count}건"

          if [[ "$fallback_count" != "0" ]]; then
            python -u -m collector.classify_relevance_gemini \
              --data-dir /tmp/gemini-fallback \
              --model "$GEMINI_FALLBACK_MODEL" \
              --batch-size 10 \
              --max-articles 20000 \
              --request-delay 3 \
              --force

            python - <<'PY'
          from pathlib import Path
          import json

          source_root = Path('/tmp/gemini-fallback')
          target_root = Path('docs/data')
          updated = 0
          for source in source_root.glob('[0-9][0-9][0-9][0-9]/[0-9][0-9]/[0-9][0-9]/articles.json'):
              target = target_root / source.relative_to(source_root)
              source_payload = json.loads(source.read_text(encoding='utf-8'))
              target_payload = json.loads(target.read_text(encoding='utf-8'))
              results = {
                  str(article.get('id')): article.get('ip_relevance')
                  for article in source_payload.get('articles', [])
                  if isinstance(article.get('ip_relevance'), dict)
              }
              for article in target_payload.get('articles', []):
                  result = results.get(str(article.get('id')))
                  if result and result.get('method') == 'gemini-api':
                      article['ip_relevance'] = result
                      updated += 1
              target.write_text(json.dumps(target_payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'대체 모델 정상 결과 병합: {updated}건')
          PY
          fi

      - name: 전체 색인 재생성 및 상태 검증
        shell: bash
        run: |
          set -euo pipefail
          python -m collector.build_indexes
          python - <<'PY' | tee /tmp/final-status.txt
          from collections import Counter
          from pathlib import Path
          import json

          manifest = json.loads(Path('docs/data/manifest.json').read_text(encoding='utf-8'))
          methods = Counter()
          for path in Path('docs/data').glob('[0-9][0-9][0-9][0-9]/[0-9][0-9]/[0-9][0-9]/articles.json'):
              payload = json.loads(path.read_text(encoding='utf-8'))
              for article in payload.get('articles', []):
                  methods[article.get('ip_relevance', {}).get('method', 'unclassified')] += 1

          print('최종 데이터 기준일:', manifest.get('last_date'))
          print('전체 기사:', manifest.get('article_count'))
          print('미분류:', manifest.get('unclassified_count'))
          print('판정 방식:', dict(sorted(methods.items())))
          print('rules-fallback 잔여:', methods['rules-fallback'])

          if manifest.get('last_date') != '2026-10-30':
              raise SystemExit(f"최종 날짜가 2026-10-30이 아닙니다: {manifest.get('last_date')}")
          if int(manifest.get('unclassified_count') or 0) != 0:
              raise SystemExit('미분류 자료가 남아 있습니다.')
          PY

      - name: 브라우저 캐시 갱신 표식 반영
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'assets/app\.js(?:\?v=[^"\']*)?', 'assets/app.js?v=20261030-2', text)
          path.write_text(text, encoding='utf-8')
          PY
          node --check docs/assets/app.js

      - name: 변경사항 main 반영
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "policy-dashboard-bot"
          git config user.email "policy-dashboard-bot@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/rebuild-current-20260826-20261030.yml
          git add docs/data docs/index.html
          if git diff --cached --quiet; then
            echo "변경사항이 없습니다."
          else
            git commit -m "data: 2026-08-26~2026-10-30 수집·Gemini 분류·색인 재구축"
          fi

          git fetch origin main
          git merge --no-edit -X ours origin/main
          git push origin HEAD:main

      - name: Pages 설정
        uses: actions/configure-pages@v6

      - name: Pages 파일 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5

      - name: 실행 결과 요약
        if: always()
        run: |
          {
            echo '### 2026-08-26 이후 재구축 결과'
            echo '```text'
            if [[ -f /tmp/final-status.txt ]]; then cat /tmp/final-status.txt; else echo '최종 상태 파일 미생성'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
