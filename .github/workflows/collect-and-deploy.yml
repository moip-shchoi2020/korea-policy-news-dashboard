name: 보도자료 수집·AI 연관도 분석 및 대시보드 배포

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.skip_collection && '기존 데이터 AI 분석 및 배포' ||
      github.event_name == 'workflow_dispatch' && '수동 수집·AI 분석 및 배포' ||
      github.event_name == 'schedule' && 'KST 예약 슬롯 점검·필요 시 실행' ||
      '코드 변경 배포(수집·AI 분석 없음)' }}

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "collector/**"
      - "tests/**"
      - "requirements.txt"
      - ".gitignore"
      - ".github/workflows/collect-and-deploy.yml"
  schedule:
    # GitHub의 단일 예약 이벤트는 지연·누락될 수 있으므로 각 목표 시각에 20분 간격으로 재시도한다.
    # cron은 UTC 기준이며, 아래 시각은 KST로 08/09, 11/12, 16/17, 19/20시의 03·23·43분이다.
    # 실제 실행 여부는 collector.schedule_control이 KST 기준 슬롯과 완료 상태를 판정한다.
    - cron: "3,23,43 0,2,3,7,8,10,11,23 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "수집 시작일 YYYY-MM-DD (비우면 최근 기간 재확인)"
        required: false
        type: string
      end_date:
        description: "수집 종료일 YYYY-MM-DD (시작일과 함께 입력)"
        required: false
        type: string
      lookback_days:
        description: "날짜를 비운 경우 오늘 포함 재확인할 일수"
        required: false
        default: "3"
        type: string
      skip_collection:
        description: "기존 데이터만 AI 분석하고 보도자료 수집은 생략"
        required: false
        default: false
        type: boolean
      force_ai_reclassify:
        description: "기존 AI 판정을 모두 다시 수행(기준·모델 변경 시만 사용)"
        required: false
        default: false
        type: boolean
      send_telegram:
        description: "실행 완료 후 텔레그램 브리핑 시험 발송"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write
  models: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

# 다음 재시도 이벤트가 이전 실행을 취소하지 않도록 직렬화한다.
concurrency:
  group: policy-dashboard-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  schedule_guard:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.guard.outputs.allowed }}
      reason: ${{ steps.guard.outputs.reason }}
      slot_key: ${{ steps.guard.outputs.slot_key }}
      slot_date: ${{ steps.guard.outputs.slot_date }}
      slot_label: ${{ steps.guard.outputs.slot_label }}
      telegram_required: ${{ steps.guard.outputs.telegram_required }}
      telegram_title: ${{ steps.guard.outputs.telegram_title }}
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: 한국시간 예약 슬롯 판정
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          echo "GitHub event: $GITHUB_EVENT_NAME"
          echo "UTC now: $(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "KST now: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S %Z')"

          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            python3 -m collector.schedule_control decide \
              --state-path docs/data/schedule_state.json \
              --github-output "$GITHUB_OUTPUT" \
              --github-summary "$GITHUB_STEP_SUMMARY"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "reason=수동 실행 또는 코드 변경 배포" >> "$GITHUB_OUTPUT"
            echo "slot_key=" >> "$GITHUB_OUTPUT"
            echo "slot_date=" >> "$GITHUB_OUTPUT"
            echo "slot_label=수동 실행 또는 코드 변경 배포" >> "$GITHUB_OUTPUT"
            echo "telegram_required=false" >> "$GITHUB_OUTPUT"
            echo "telegram_title=" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: schedule_guard
    if: needs.schedule_guard.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: 실행 유형 및 예약 슬롯 확인
        shell: bash
        env:
          SLOT_LABEL: ${{ needs.schedule_guard.outputs.slot_label }}
          SLOT_REASON: ${{ needs.schedule_guard.outputs.reason }}
        run: |
          echo "GitHub event: $GITHUB_EVENT_NAME"
          echo "예정 작업: $SLOT_LABEL"
          echo "판정 사유: $SLOT_REASON"
          echo "UTC now: $(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "KST now: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S %Z')"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "코드 업로드로 시작된 실행이므로 보도자료 수집과 AI 분석은 생략하고 기존 데이터만 배포합니다."
          fi

      - name: Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Python 패키지 설치
        run: pip install -r requirements.txt

      - name: Python 기본 테스트
        run: python -m unittest discover -s tests -v

      - name: JavaScript 문법 검사
        run: node --check docs/assets/app.js

      - name: 보도자료 수집
        if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || !inputs.skip_collection)
        timeout-minutes: 20
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          INPUT_LOOKBACK_DAYS: ${{ inputs.lookback_days || '3' }}
          CONNECT_TIMEOUT_SECONDS: '15'
          READ_TIMEOUT_SECONDS: '30'
          HTTP_RETRY_TOTAL: '2'
          HTTP_BACKOFF_FACTOR: '1.5'
          KOREA_MOBILE_FALLBACK: 'true'
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -euo pipefail
          LOOKBACK_DAYS="$INPUT_LOOKBACK_DAYS"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            # 정기 실행은 누락 복구를 위해 한국시간 오늘 포함 최근 3일을 재확인한다.
            LOOKBACK_DAYS="3"
          fi
          args=(--lookback-days "$LOOKBACK_DAYS" --continue-on-error --detail-workers 3 --max-pages-per-day 10)
          if [[ -n "$START_DATE" && -n "$END_DATE" ]]; then
            args+=(--start-date "$START_DATE" --end-date "$END_DATE")
          else
            args+=(--require-records)
          fi
          python -u -m collector.collect "${args[@]}"

      - name: 지식재산처 AI 연관도 분석
        if: success() && github.event_name != 'push'
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL || 'openai/gpt-4.1-mini' }}
          FORCE_AI_RECLASSIFY: ${{ inputs.force_ai_reclassify || false }}
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -euo pipefail
          args=(--model "$GITHUB_MODELS_MODEL" --batch-size 3 --max-articles 300 --request-delay 4.1)
          if [[ "$FORCE_AI_RECLASSIFY" == "true" ]]; then
            args+=(--force)
          fi
          python -u -m collector.classify_relevance "${args[@]}"

      - name: 색인 재생성
        if: success()
        run: python -m collector.build_indexes

      - name: 수집·AI 분석 결과 진단
        if: always() && github.event_name != 'push'
        shell: bash
        run: |
          echo "### 보도자료 수집·지식재산처 연관도 분석 결과" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          find docs/data -maxdepth 5 -type f -print | sort | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "manifest.json:"
          cat docs/data/manifest.json || true

      - name: 변경 데이터 저장소에 반영
        if: success() && github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "policy-dashboard-bot"
          git config user.email "policy-dashboard-bot@users.noreply.github.com"

          git add docs/data
          echo "커밋 전 데이터 변경 파일:"
          git status --short docs/data

          if git diff --cached --quiet; then
            echo "새 데이터 변경이 없습니다."
            exit 0
          fi

          git commit -m "data: 보도자료 및 지식재산처 AI 연관도 갱신"

          # CI에서 의도한 변경은 docs/data뿐이다. Python 캐시 등 나머지 tracked 변경은 제거한다.
          echo "커밋 후 전체 작업트리 상태:"
          git status --short
          git reset --hard HEAD
          git clean -fd

          for attempt in 1 2 3; do
            echo "원격 main 동기화 및 push 시도 ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "원격 main과 자동 rebase에 실패했습니다."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "데이터 push 완료"
              exit 0
            fi
            sleep $((attempt * 3))
          done

          echo "3회 시도 후에도 push하지 못했습니다."
          exit 1

      - name: GitHub Pages 설정
        if: success()
        uses: actions/configure-pages@v6

      - name: Pages 배포 파일 업로드
        if: success()
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5

  notify_telegram:
    needs: [schedule_guard, build, deploy]
    if: >-
      ${{
        always() &&
        needs.schedule_guard.outputs.allowed == 'true' &&
        needs.build.result == 'success' &&
        needs.deploy.result == 'success' &&
        (
          (github.event_name == 'schedule' && needs.schedule_guard.outputs.telegram_required == 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.send_telegram)
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 최신 저장 데이터 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Telegram 전송 패키지 설치
        run: pip install requests

      - name: Telegram 설정 사전 점검
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" ]]; then
            echo "::error::Repository secret TELEGRAM_BOT_TOKEN이 없습니다."
            exit 1
          fi
          if [[ -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::error::Repository secret TELEGRAM_CHAT_ID가 없습니다."
            exit 1
          fi
          echo "Telegram Bot Token과 Chat ID가 등록되어 있습니다."

      - name: 텔레그램 브리핑 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_KEYWORDS: ${{ vars.TELEGRAM_KEYWORDS }}
          TELEGRAM_MAX_CRITICAL: ${{ vars.TELEGRAM_MAX_CRITICAL || '20' }}
          TELEGRAM_MAX_IMPORTANT: ${{ vars.TELEGRAM_MAX_IMPORTANT || '20' }}
          TELEGRAM_MAX_NORMAL: ${{ vars.TELEGRAM_MAX_NORMAL || '5' }}
          TELEGRAM_MAX_UNCLASSIFIED: ${{ vars.TELEGRAM_MAX_UNCLASSIFIED || '3' }}
          TELEGRAM_MAX_ARTICLES: ${{ vars.TELEGRAM_MAX_ARTICLES || '30' }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          REPORT_DATE: ${{ github.event_name == 'schedule' && needs.schedule_guard.outputs.slot_date || inputs.end_date }}
          PIPELINE_BUILD_RESULT: ${{ needs.build.result }}
          PIPELINE_DEPLOY_RESULT: ${{ needs.deploy.result }}
          TRIGGER_SLOT: ${{ needs.schedule_guard.outputs.slot_key }}
          TELEGRAM_REPORT_TITLE: ${{ github.event_name == 'schedule' && needs.schedule_guard.outputs.telegram_title || '수동 시험 발송' }}
          PYTHONUNBUFFERED: '1'
        run: python -u -m collector.send_telegram --require-config

  finalize_schedule:
    needs: [schedule_guard, build, deploy, notify_telegram]
    if: >-
      ${{
        always() &&
        github.event_name == 'schedule' &&
        needs.schedule_guard.outputs.allowed == 'true' &&
        needs.build.result == 'success' &&
        needs.deploy.result == 'success' &&
        (
          needs.schedule_guard.outputs.telegram_required != 'true' ||
          needs.notify_telegram.result == 'success'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 최신 main 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: 예약 슬롯 완료 상태 기록
        env:
          SLOT_KEY: ${{ needs.schedule_guard.outputs.slot_key }}
          SLOT_LABEL: ${{ needs.schedule_guard.outputs.slot_label }}
          TELEGRAM_REQUIRED: ${{ needs.schedule_guard.outputs.telegram_required }}
        run: |
          set -euo pipefail
          python3 -m collector.schedule_control mark \
            --state-path docs/data/schedule_state.json \
            --slot-key "$SLOT_KEY" \
            --slot-label "$SLOT_LABEL" \
            --telegram-required "$TELEGRAM_REQUIRED"

      - name: 완료 상태 저장소에 반영
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "policy-dashboard-bot"
          git config user.email "policy-dashboard-bot@users.noreply.github.com"
          git add docs/data/schedule_state.json

          if git diff --cached --quiet; then
            echo "예약 상태 변경이 없습니다."
            exit 0
          fi

          git commit -m "chore: KST 예약 슬롯 완료 기록"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "예약 슬롯 완료 상태 push 완료"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "예약 슬롯 완료 상태를 push하지 못했습니다."
          exit 1
