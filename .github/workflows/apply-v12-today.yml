name: 오늘 자료 v1.2 정책상한 적용

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-v12-today.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 2026-11-09 자료에 v1.2 정책상한 적용
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json

          from collector.classify_relevance import (
              LEVEL_ACTIONS,
              LEVEL_LABELS,
              LEVEL_SCORES,
              VALID_LEVELS,
              article_source_hash,
              constrain_model_result,
              load_policy,
              rule_classify,
          )
          from collector.common import now_iso

          path = Path('docs/data/2026/11/09/articles.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          policy = load_policy(Path('collector/relevance_policy.json'))
          before = Counter()
          after = Counter()
          changed = []

          for article in payload.get('articles', []):
              old = article.get('ip_relevance') if isinstance(article.get('ip_relevance'), dict) else {}
              old_level = str(old.get('level') or 'unclassified')
              before[old_level] += 1
              rule_result, needs_model = rule_classify(article, policy)

              if needs_model and old_level in VALID_LEVELS:
                  guarded = constrain_model_result(article, old, policy)
                  final = dict(old)
                  final.update(guarded)
                  final['method'] = str(old.get('method') or 'rules')
                  final['policy_guard'] = policy['prompt_version']
              else:
                  final = dict(rule_result)

              level = str(final.get('level') or 'unrelated')
              if level not in VALID_LEVELS:
                  level = 'unrelated'
              final.update({
                  'level': level,
                  'label': LEVEL_LABELS[level],
                  'score': LEVEL_SCORES[level],
                  'recommended_action': LEVEL_ACTIONS[level],
                  'prompt_version': policy['prompt_version'],
                  'classified_at': now_iso(),
                  'source_hash': article_source_hash(article),
              })
              if final.get('method') == 'rules-fallback':
                  final['method'] = 'rules'
              article['ip_relevance'] = final
              after[level] += 1
              if old_level != level:
                  changed.append((old_level, level, article.get('title', '')))

          if len(payload.get('articles', [])) != 86:
              raise SystemExit(f"예상 기사 86건과 다릅니다: {len(payload.get('articles', []))}건")
          if any(article.get('ip_relevance', {}).get('prompt_version') != 'ip-office-relevance-v1.2' for article in payload.get('articles', [])):
              raise SystemExit('v1.2 정책버전이 적용되지 않은 기사가 있습니다.')

          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('적용 전:', dict(before))
          print('적용 후:', dict(after))
          print('등급 변경:', len(changed), '건')
          for old_level, new_level, title in changed:
              print(f'- {old_level} -> {new_level}: {title}')
          PY

      - name: 색인 재생성 및 검증
        run: |
          python -m collector.build_indexes
          python -m unittest discover -s tests -v
          python -m py_compile collector/*.py
          node --check docs/assets/app.js
          printf 'ip-office-relevance-v1.2\n%s\n' "$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')" > docs/assets/relevance-build.txt

      - name: 결과 반영 및 일회성 작업 정리
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "policy-dashboard-bot"
          git config user.email "policy-dashboard-bot@users.noreply.github.com"
          git rm .github/workflows/apply-v12-today.yml
          git add docs/data docs/assets/relevance-build.txt
          git commit -m "data: 2026-11-09 v1.2 정책상한 적용"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v6

      - name: Pages 배포 파일 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
