name: A/B 분류기준 적용

on:
  push:
    branches:
      - fix/relevance-ab-policy-v11
    paths:
      - ".github/workflows/apply-relevance-ab-policy-v11.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6
        with:
          ref: fix/relevance-ab-policy-v11
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: 분류기준 적용
        run: python scripts/apply_relevance_policy_v11.py

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 전체 테스트 및 문법 검사
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile collector/*.py
          node --check docs/assets/app.js
          node --check docs/assets/priority-visibility.js

      - name: 대표 과대분류 사례 검증
        run: |
          python - <<'PY'
          from pathlib import Path
          from collector.classify_relevance import load_policy, rule_classify

          policy = load_policy(Path('collector/relevance_policy.json'))
          article = {
              'title': '동아시아 기록관리 전문가, 한 자리에 모여 기록관리의 미래를 논하다',
              'summary': '인공지능 네이티브 기록관 미래상과 전자기록 통합 관리 체계를 소개하고 논의한다.',
              'content_text': '국가기록원 국제 협의회에서 사례를 공유한다.',
              'ministry': '행정안전부',
          }
          result, needs_model = rule_classify(article, policy)
          print('표본 판정:', result, 'needs_model=', needs_model)
          assert result['level'] == 'unrelated'
          assert needs_model is False
          PY

      - name: 일회성 파일 제거 및 브랜치 반영
        run: |
          rm -f .github/workflows/apply-relevance-ab-policy-v11.yml
          rm -f scripts/apply_relevance_policy_v11.py
          git config user.name "policy-dashboard-bot"
          git config user.email "policy-dashboard-bot@users.noreply.github.com"
          git add collector/relevance_policy.json collector/classify_relevance.py collector/classify_relevance_gemini.py tests/test_relevance.py .github/workflows/apply-relevance-ab-policy-v11.yml scripts/apply_relevance_policy_v11.py
          git commit -m "feat: A/B 조건과 행사·논의 상한을 분류 기준에 적용"
          git push origin HEAD:fix/relevance-ab-policy-v11
