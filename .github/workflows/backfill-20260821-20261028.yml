name: 일회성 누락기간 데이터 백필

run-name: 2026-08-21~2026-10-28 보도자료 백필

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-20260821-20261028.yml"

permissions:
  contents: write
  pages: write
  id-token: write
  models: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: policy-dashboard-${{ github.repository }}-main
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Python 패키지 설치
        run: pip install -r requirements.txt

      - name: 기본 테스트
        run: |
          python -m unittest discover -s tests -v
          node --check docs/assets/app.js

      - name: 2026-08-21부터 2026-10-28까지 보도자료 수집
        timeout-minutes: 70
        env:
          CONNECT_TIMEOUT_SECONDS: "15"
          READ_TIMEOUT_SECONDS: "30"
          HTTP_RETRY_TOTAL: "2"
          HTTP_BACKOFF_FACTOR: "1.5"
          KOREA_MOBILE_FALLBACK: "true"
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -euo pipefail
          ranges=(
            "2026-08-21 2026-08-31"
            "2026-09-01 2026-09-15"
            "2026-09-16 2026-09-30"
            "2026-10-01 2026-10-15"
            "2026-10-16 2026-10-28"
          )
          for range in "${ranges[@]}"; do
            read -r start_date end_date <<< "$range"
            echo "::group::수집 ${start_date} ~ ${end_date}"
            python -u -m collector.collect \
              --start-date "$start_date" \
              --end-date "$end_date" \
              --continue-on-error \
              --detail-workers 3 \
              --max-pages-per-day 10
            echo "::endgroup::"
          done

      - name: 신규 자료 지식재산처 AI 연관도 분석
        timeout-minutes: 80
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL || 'openai/gpt-4.1-mini' }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u -m collector.classify_relevance \
            --model "$GITHUB_MODELS_MODEL" \
            --batch-size 3 \
            --max-articles 5000 \
            --request-delay 4.1

      - name: 색인 재생성
        run: python -m collector.build_indexes

      - name: 결과 확인
        shell: bash
        run: |
          echo "### 일회성 백필 결과" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat docs/data/manifest.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 데이터 변경 저장
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "policy-dashboard-bot"
          git config user.email "policy-dashboard-bot@users.noreply.github.com"
          git add docs/data
          git status --short docs/data
          if git diff --cached --quiet; then
            echo "새 데이터 변경이 없습니다."
          else
            git commit -m "data: 2026-08-21부터 2026-10-28까지 보도자료 백필"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v6

      - name: Pages 배포 파일 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: backfill
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
