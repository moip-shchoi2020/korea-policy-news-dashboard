name: Telegram 키워드 표시 정리

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/compact-telegram-keyword-label.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: 코드 수정
        run: |
          python <<'PY'
          from pathlib import Path

          init_path = Path('collector/__init__.py')
          init_text = init_path.read_text(encoding='utf-8')
          old_init = '''    if expanded:\n        os.environ["TELEGRAM_KEYWORDS"] = ",".join(expanded)\n\n    # 명시적으로 false를 지정한 경우에만 키워드 게이트를 해제할 수 있다.\n'''
          new_init = '''    if base_keywords:\n        os.environ["TELEGRAM_DISPLAY_KEYWORDS"] = ",".join(base_keywords)\n    if expanded:\n        os.environ["TELEGRAM_KEYWORDS"] = ",".join(expanded)\n\n    # 명시적으로 false를 지정한 경우에만 키워드 게이트를 해제할 수 있다.\n'''
          if old_init not in init_text:
              raise SystemExit('collector/__init__.py 패치 위치를 찾지 못했습니다.')
          init_path.write_text(init_text.replace(old_init, new_init), encoding='utf-8')

          telegram_path = Path('collector/send_telegram.py')
          telegram_text = telegram_path.read_text(encoding='utf-8')
          old_header = '''    if safe_bool_env("TELEGRAM_REQUIRE_KEYWORD_MATCH", False):\n        keyword_text = ", ".join(result.keywords) if result.keywords else "전체 보도자료"\n        lines[-1] += f" · 키워드: {escape(keyword_text)}"\n'''
          new_header = '''    if safe_bool_env("TELEGRAM_REQUIRE_KEYWORD_MATCH", False):\n        display_keywords = parse_keywords(os.getenv("TELEGRAM_DISPLAY_KEYWORDS", ""))\n        keyword_values = display_keywords or result.keywords\n        keyword_text = ", ".join(keyword_values) if keyword_values else "전체 보도자료"\n        alias_note = " (유사어 포함)" if display_keywords else ""\n        lines[-1] += f" · 키워드: {escape(keyword_text)}{alias_note}"\n'''
          if old_header not in telegram_text:
              raise SystemExit('collector/send_telegram.py 패치 위치를 찾지 못했습니다.')
          telegram_path.write_text(
              telegram_text.replace(old_header, new_header),
              encoding='utf-8',
          )
          PY

      - name: 패키지 설치 및 테스트
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
          python -m py_compile collector/*.py

      - name: 실제 운영 데이터 미리보기 검증
        env:
          TELEGRAM_LEVELS: "critical,important"
          TELEGRAM_REPORT_TITLE: "표시 검증"
        run: |
          python -u -m collector.send_telegram --date 2026-11-03 --preview > /tmp/telegram-preview.txt
          cat /tmp/telegram-preview.txt
          grep -F "키워드: AI, 정보화 사업, 시스템, AX (유사어 포함)" /tmp/telegram-preview.txt
          if grep -F "키워드: AI, 인공지능" /tmp/telegram-preview.txt; then
            echo "확장 유사어 전체 목록이 머리말에 노출됐습니다."
            exit 1
          fi

      - name: 일회성 워크플로 제거 및 반영
        run: |
          rm -f .github/workflows/compact-telegram-keyword-label.yml
          git config user.name "policy-dashboard-bot"
          git config user.email "policy-dashboard-bot@users.noreply.github.com"
          git add collector/__init__.py collector/send_telegram.py .github/workflows/compact-telegram-keyword-label.yml
          git commit -m "fix: Telegram 키워드 머리말을 대표어로 축약"
          git push origin HEAD:main
