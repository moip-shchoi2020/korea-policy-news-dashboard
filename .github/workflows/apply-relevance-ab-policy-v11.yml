name: A/B 분류기준 적용

on:
  push:
    branches:
      - fix/relevance-ab-policy-v11
    paths:
      - ".github/workflows/apply-relevance-ab-policy-v11.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6
        with:
          ref: fix/relevance-ab-policy-v11
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: 패치 스크립트 문자열 보정
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_relevance_policy_v11.py')
          text = path.read_text(encoding='utf-8')
          old = "    new_prompt = textwrap.dedent(\n        '''\n"
          new = "    new_prompt = textwrap.dedent(\n        r'''\n"
          if old not in text:
              raise SystemExit('프롬프트 생성 블록을 찾지 못했습니다.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: 분류기준 적용
        run: python scripts/apply_relevance_policy_v11.py

      - name: 정책 버전 캐시 테스트 조정
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('tests/test_gemini_relevance.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('    def test_gemini_record_preserves_provider_and_model')
          end = text.index('\n\nif __name__ == "__main__":', start)
          replacement = textwrap.dedent('''
          def test_gemini_record_preserves_provider_and_model(self) -> None:
              record = finalize_gemini_record(
                  {
                      "level": "important",
                      "confidence": 0.9,
                      "reason": "정책 영향이 있습니다.",
                      "signals": ["AI"],
                  },
                  source_hash="source-hash",
                  policy=self.policy,
                  model="gemini-3.1-flash-lite",
                  method="gemini-api",
              )

              self.assertEqual(record["method"], "gemini-api")
              self.assertEqual(record["model"], "google/gemini-3.1-flash-lite")
              self.assertEqual(record["prompt_version"], self.policy["prompt_version"])

          def test_legacy_result_is_invalidated_when_policy_changes(self) -> None:
              article: dict[str, Any] = {
                  "id": "legacy-1",
                  "title": "AI 기본법 개정",
                  "summary": "전 부처 기준",
                  "content_text": "전 부처에 적용되는 기준을 개정한다.",
                  "ministry": "과학기술정보통신부",
              }
              article["ip_relevance"] = {
                  "level": "critical",
                  "method": "github-models",
                  "model": "openai/gpt-4.1-mini",
                  "prompt_version": "ip-office-relevance-v1.0",
                  "source_hash": article_source_hash(article),
              }

              self.assertFalse(
                  gemini_classification_is_current(
                      article,
                      self.policy,
                      "google/gemini-3.1-flash-lite",
                      True,
                  )
              )

          def test_gemini_model_change_invalidates_gemini_cache(self) -> None:
              article: dict[str, Any] = {
                  "id": "gemini-1",
                  "title": "AI 공통기준",
                  "summary": "공통기준",
                  "content_text": "행정기관 공통기준을 시행한다.",
                  "ministry": "행정안전부",
              }
              article["ip_relevance"] = {
                  "level": "important",
                  "method": "gemini-api",
                  "model": "google/gemini-3.1-flash-lite",
                  "prompt_version": self.policy["prompt_version"],
                  "source_hash": article_source_hash(article),
              }

              self.assertTrue(
                  gemini_classification_is_current(
                      article,
                      self.policy,
                      "google/gemini-3.1-flash-lite",
                      True,
                  )
              )
              self.assertFalse(
                  gemini_classification_is_current(
                      article,
                      self.policy,
                      "google/gemini-3.5-flash-lite",
                      True,
                  )
              )
          ''').strip()
          replacement = textwrap.indent(replacement, '    ')
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 전체 테스트 및 문법 검사
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile collector/*.py
          node --check docs/assets/app.js
          node --check docs/assets/priority-visibility.js

      - name: 대표 과대분류 사례 검증
        run: |
          python - <<'PY'
          from pathlib import Path
          from collector.classify_relevance import load_policy, rule_classify

          policy = load_policy(Path('collector/relevance_policy.json'))
          article = {
              'title': '동아시아 기록관리 전문가, 한 자리에 모여 기록관리의 미래를 논하다',
              'summary': '인공지능 네이티브 기록관 미래상과 전자기록 통합 관리 체계를 소개하고 논의한다.',
              'content_text': '국가기록원 국제 협의회에서 사례를 공유한다.',
              'ministry': '행정안전부',
          }
          result, needs_model = rule_classify(article, policy)
          print('표본 판정:', result, 'needs_model=', needs_model)
          assert result['level'] == 'unrelated'
          assert needs_model is False
          PY

      - name: 일회성 파일 제거 및 브랜치 반영
        run: |
          rm -f .github/workflows/apply-relevance-ab-policy-v11.yml
          rm -f scripts/apply_relevance_policy_v11.py
          git config user.name "policy-dashboard-bot"
          git config user.email "policy-dashboard-bot@users.noreply.github.com"
          git add collector/relevance_policy.json collector/classify_relevance.py collector/classify_relevance_gemini.py tests/test_relevance.py tests/test_gemini_relevance.py .github/workflows/apply-relevance-ab-policy-v11.yml scripts/apply_relevance_policy_v11.py
          git commit -m "feat: A/B 조건과 행사·논의 상한을 분류 기준에 적용"
          git push origin HEAD:fix/relevance-ab-policy-v11
