name: Gemini 실제 API 단독 검증

on:
  push:
    branches:
      - test/gemini-live-20261029

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 합성자료 1건 생성
        shell: bash
        run: |
          mkdir -p /tmp/gemini-test/2026/10/29
          cat > /tmp/gemini-test/2026/10/29/articles.json <<'JSON'
          {
            "schema_version": 2,
            "date": "2026-10-29",
            "articles": [{
              "id": "gemini-live-test-1",
              "title": "전 부처 생성형 AI 공통 보안기준 시행",
              "summary": "행정기관 공통 보안·데이터 관리 기준을 시행한다.",
              "ministry": "행정안전부",
              "publish_date": "2026-10-29",
              "content_text": "정부는 전 부처에 적용되는 생성형 AI 보안, 데이터 관리 및 정보시스템 운영 공통기준을 시행한다. 중앙행정기관은 내부 규정과 시스템에 필요한 보호조치를 반영해야 한다."
            }]
          }
          JSON

      - name: Gemini 실제 호출
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        run: |
          python -u -m collector.classify_relevance_gemini \
            --data-dir /tmp/gemini-test \
            --model "$GEMINI_MODEL" \
            --batch-size 1 \
            --max-articles 1 \
            --request-delay 0 \
            --force \
            --require-ai

      - name: 결과 검증
        env:
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          article = json.loads(Path('/tmp/gemini-test/2026/10/29/articles.json').read_text(encoding='utf-8'))['articles'][0]
          result = article['ip_relevance']
          assert result['method'] == 'gemini-api', result
          assert result['model'] == f"google/{os.environ['GEMINI_MODEL']}", result
          assert result['level'] in {'critical', 'important', 'normal', 'unrelated'}, result
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
