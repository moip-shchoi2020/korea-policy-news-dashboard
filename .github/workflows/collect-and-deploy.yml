name: 보도자료 수집·AI 연관도 분석 및 대시보드 배포

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.external_slot != '' && 'Cloudflare 외부 예약 실행' ||
      github.event_name == 'workflow_dispatch' && inputs.skip_collection && '기존 데이터 AI 분석 및 배포' ||
      github.event_name == 'workflow_dispatch' && '수동 수집·AI 분석 및 배포' ||
      '코드 변경 배포(수집·AI 분석 없음)' }}

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "collector/**"
      - "tests/**"
      - "requirements.txt"
      - ".gitignore"
      - ".github/workflows/collect-and-deploy.yml"
  # GitHub 자체 cron은 사용하지 않는다.
  # Cloudflare Workers가 workflow_dispatch REST API를 호출한다.
  workflow_dispatch:
    inputs:
      start_date:
        description: "수집 시작일 YYYY-MM-DD (비우면 최근 기간 재확인)"
        required: false
        type: string
      end_date:
        description: "수집 종료일 YYYY-MM-DD (시작일과 함께 입력)"
        required: false
        type: string
      lookback_days:
        description: "날짜를 비운 경우 오늘 포함 재확인할 일수"
        required: false
        default: "3"
        type: string
      skip_collection:
        description: "기존 데이터만 AI 분석하고 보도자료 수집은 생략"
        required: false
        default: false
        type: boolean
      force_ai_reclassify:
        description: "기존 AI 판정을 모두 다시 수행(기준·모델 변경 시만 사용)"
        required: false
        default: false
        type: boolean
      send_telegram:
        description: "실행 완료 후 Telegram 브리핑 발송"
        required: false
        default: false
        type: boolean
      external_slot:
        description: "외부 스케줄 슬롯 식별자(Cloudflare가 자동 입력)"
        required: false
        type: string
      external_label:
        description: "외부 스케줄 작업명(Cloudflare가 자동 입력)"
        required: false
        type: string
      external_source:
        description: "외부 호출 출처(Cloudflare가 자동 입력)"
        required: false
        type: string
      report_date:
        description: "Telegram 기준일 YYYY-MM-DD(Cloudflare가 자동 입력)"
        required: false
        type: string
      telegram_title:
        description: "Telegram 브리핑 제목(Cloudflare가 자동 입력)"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write
  models: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

# 같은 저장소의 수집·배포를 직렬화한다. Cloudflare의 20분 재시도 요청은 앞 실행 뒤에 대기한다.
concurrency:
  group: policy-dashboard-${{ github.repository }}-main
  cancel-in-progress: false

jobs:
  dispatch_guard:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.guard.outputs.allowed }}
      reason: ${{ steps.guard.outputs.reason }}
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: 외부 예약 슬롯 중복 여부 확인
        id: guard
        shell: bash
        env:
          EXTERNAL_SLOT: ${{ inputs.external_slot }}
          EXTERNAL_LABEL: ${{ inputs.external_label }}
          EXTERNAL_SOURCE: ${{ inputs.external_source }}
        run: |
          set -euo pipefail
          echo "GitHub event: $GITHUB_EVENT_NAME"
          echo "UTC now: $(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "KST now: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "External source: ${EXTERNAL_SOURCE:-manual-or-push}"
          echo "External slot: ${EXTERNAL_SLOT:-none}"
          echo "External label: ${EXTERNAL_LABEL:-none}"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$EXTERNAL_SLOT" ]]; then
            python3 -m collector.external_dispatch_control decide \
              --state-path docs/data/external_schedule_state.json \
              --slot-key "$EXTERNAL_SLOT" \
              --github-output "$GITHUB_OUTPUT"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "reason=일반 수동 실행 또는 코드 변경 배포" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: dispatch_guard
    if: needs.dispatch_guard.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: 실행 유형 확인
        shell: bash
        env:
          GUARD_REASON: ${{ needs.dispatch_guard.outputs.reason }}
          EXTERNAL_SLOT: ${{ inputs.external_slot }}
          EXTERNAL_LABEL: ${{ inputs.external_label }}
          EXTERNAL_SOURCE: ${{ inputs.external_source }}
        run: |
          echo "GitHub event: $GITHUB_EVENT_NAME"
          echo "판정 사유: $GUARD_REASON"
          echo "외부 호출: ${EXTERNAL_SOURCE:-none}"
          echo "외부 슬롯: ${EXTERNAL_SLOT:-none}"
          echo "작업명: ${EXTERNAL_LABEL:-manual-or-push}"
          echo "UTC now: $(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "KST now: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S %Z')"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "코드 업로드로 시작된 실행이므로 보도자료 수집과 AI 분석은 생략하고 기존 데이터만 배포합니다."
          fi

      - name: Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Python 패키지 설치
        run: pip install -r requirements.txt

      - name: Python 기본 테스트
        run: python -m unittest discover -s tests -v

      - name: JavaScript 문법 검사
        run: node --check docs/assets/app.js

      - name: 보도자료 수집
        if: github.event_name != 'push' && !inputs.skip_collection
        timeout-minutes: 20
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          INPUT_LOOKBACK_DAYS: ${{ inputs.lookback_days || '3' }}
          CONNECT_TIMEOUT_SECONDS: '15'
          READ_TIMEOUT_SECONDS: '30'
          HTTP_RETRY_TOTAL: '2'
          HTTP_BACKOFF_FACTOR: '1.5'
          KOREA_MOBILE_FALLBACK: 'true'
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -euo pipefail
          args=(--lookback-days "$INPUT_LOOKBACK_DAYS" --continue-on-error --detail-workers 3 --max-pages-per-day 10)
          if [[ -n "$START_DATE" && -n "$END_DATE" ]]; then
            args+=(--start-date "$START_DATE" --end-date "$END_DATE")
          else
            args+=(--require-records)
          fi
          python -u -m collector.collect "${args[@]}"

      - name: 지식재산처 AI 연관도 분석
        if: success() && github.event_name != 'push'
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL || 'openai/gpt-4.1-mini' }}
          FORCE_AI_RECLASSIFY: ${{ inputs.force_ai_reclassify || false }}
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -euo pipefail
          args=(--model "$GITHUB_MODELS_MODEL" --batch-size 3 --max-articles 300 --request-delay 4.1)
          if [[ "$FORCE_AI_RECLASSIFY" == "true" ]]; then
            args+=(--force)
          fi
          python -u -m collector.classify_relevance "${args[@]}"

      - name: 색인 재생성
        if: success()
        run: python -m collector.build_indexes

      - name: 수집·AI 분석 결과 진단
        if: always() && github.event_name != 'push'
        shell: bash
        run: |
          echo "### 보도자료 수집·지식재산처 연관도 분석 결과" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          find docs/data -maxdepth 5 -type f -print | sort | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "manifest.json:"
          cat docs/data/manifest.json || true

      - name: 변경 데이터 저장소에 반영
        if: success() && github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "policy-dashboard-bot"
          git config user.email "policy-dashboard-bot@users.noreply.github.com"

          git add docs/data
          echo "커밋 전 데이터 변경 파일:"
          git status --short docs/data

          if git diff --cached --quiet; then
            echo "새 데이터 변경이 없습니다."
            exit 0
          fi

          git commit -m "data: 보도자료 및 지식재산처 AI 연관도 갱신"
          git reset --hard HEAD
          git clean -fd

          for attempt in 1 2 3; do
            echo "원격 main 동기화 및 push 시도 ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "원격 main과 자동 rebase에 실패했습니다."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "데이터 push 완료"
              exit 0
            fi
            sleep $((attempt * 3))
          done

          echo "3회 시도 후에도 push하지 못했습니다."
          exit 1

      - name: GitHub Pages 설정
        if: success()
        uses: actions/configure-pages@v6

      - name: Pages 배포 파일 업로드
        if: success()
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5

  notify_telegram:
    needs: [dispatch_guard, build, deploy]
    if: >-
      ${{
        always() &&
        needs.dispatch_guard.outputs.allowed == 'true' &&
        needs.build.result == 'success' &&
        needs.deploy.result == 'success' &&
        github.event_name == 'workflow_dispatch' &&
        inputs.send_telegram
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 최신 저장 데이터 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Telegram 전송 패키지 설치
        run: pip install requests

      - name: Telegram 설정 사전 점검
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" ]]; then
            echo "::error::Repository secret TELEGRAM_BOT_TOKEN이 없습니다."
            exit 1
          fi
          if [[ -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::error::Repository secret TELEGRAM_CHAT_ID가 없습니다."
            exit 1
          fi
          echo "Telegram Bot Token과 Chat ID가 등록되어 있습니다."

      - name: Telegram 브리핑 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_KEYWORDS: ${{ vars.TELEGRAM_KEYWORDS }}
          TELEGRAM_MAX_CRITICAL: ${{ vars.TELEGRAM_MAX_CRITICAL || '20' }}
          TELEGRAM_MAX_IMPORTANT: ${{ vars.TELEGRAM_MAX_IMPORTANT || '20' }}
          TELEGRAM_MAX_NORMAL: ${{ vars.TELEGRAM_MAX_NORMAL || '5' }}
          TELEGRAM_MAX_UNCLASSIFIED: ${{ vars.TELEGRAM_MAX_UNCLASSIFIED || '3' }}
          TELEGRAM_MAX_ARTICLES: ${{ vars.TELEGRAM_MAX_ARTICLES || '30' }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          REPORT_DATE: ${{ inputs.report_date || inputs.end_date }}
          PIPELINE_BUILD_RESULT: ${{ needs.build.result }}
          PIPELINE_DEPLOY_RESULT: ${{ needs.deploy.result }}
          TRIGGER_SLOT: ${{ inputs.external_slot }}
          TELEGRAM_REPORT_TITLE: ${{ inputs.telegram_title || '수동 시험 발송' }}
          PYTHONUNBUFFERED: '1'
        run: python -u -m collector.send_telegram --require-config

  finalize_external_slot:
    needs: [dispatch_guard, build, deploy, notify_telegram]
    if: >-
      ${{
        always() &&
        github.event_name == 'workflow_dispatch' &&
        inputs.external_slot != '' &&
        needs.dispatch_guard.outputs.allowed == 'true' &&
        needs.build.result == 'success' &&
        needs.deploy.result == 'success' &&
        (!inputs.send_telegram || needs.notify_telegram.result == 'success')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 최신 main 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: 외부 예약 슬롯 완료 상태 기록
        env:
          EXTERNAL_SLOT: ${{ inputs.external_slot }}
          EXTERNAL_LABEL: ${{ inputs.external_label }}
          EXTERNAL_SOURCE: ${{ inputs.external_source }}
        run: |
          set -euo pipefail
          python3 -m collector.external_dispatch_control mark \
            --state-path docs/data/external_schedule_state.json \
            --slot-key "$EXTERNAL_SLOT" \
            --slot-label "${EXTERNAL_LABEL:-$EXTERNAL_SLOT}" \
            --source "${EXTERNAL_SOURCE:-external}"

      - name: 완료 상태 저장소에 반영
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "policy-dashboard-bot"
          git config user.email "policy-dashboard-bot@users.noreply.github.com"
          git add docs/data/external_schedule_state.json

          if git diff --cached --quiet; then
            echo "외부 예약 상태 변경이 없습니다."
            exit 0
          fi

          git commit -m "chore: Cloudflare 외부 예약 슬롯 완료 기록"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "외부 예약 슬롯 완료 상태 push 완료"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "외부 예약 슬롯 완료 상태를 push하지 못했습니다."
          exit 1
