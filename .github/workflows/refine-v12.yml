name: v1.2 대상연결 표현 정밀검증

on:
  push:
    branches:
      - fix/target-linked-b-event-cap-v12
    paths:
      - .github/workflows/refine-v12.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6
        with:
          ref: fix/target-linked-b-event-cap-v12
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 대상연결 행동어와 행사 유형 보정
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import json

          policy_path = Path('collector/relevance_policy.json')
          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          policy['strong_action_terms'] = list(dict.fromkeys(
              policy.get('strong_action_terms', []) + [
                  '구축', '도입', '개소', '출범', '문 연다', '문을 연다'
              ]
          ))
          policy['event_override_action_terms'] = list(dict.fromkeys(
              policy.get('event_override_action_terms', []) + [
                  '개소', '출범', '문 연다', '문을 연다'
              ]
          ))
          policy['event_terms'] = list(dict.fromkeys(
              policy.get('event_terms', []) + ['학술의회']
          ))
          policy_path.write_text(
              json.dumps(policy, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          test_path = Path('tests/test_relevance.py')
          text = test_path.read_text(encoding='utf-8')
          extra = dedent('''
              def test_briefing_title_with_targeted_build_is_capped_at_normal(self) -> None:
                  article = self.article(
                      "차세대 지방행정공통시스템 구축 통합사업 설명회 개최",
                      "사업 범위와 추진 일정을 설명한다.",
                      "행정안전부",
                  )
                  evidence = classification_evidence(article, self.policy)
                  result, needs_model = rule_classify(article, self.policy)
                  self.assertTrue(evidence["condition_b"])
                  self.assertTrue(evidence["event_capped_normal"])
                  self.assertEqual(result["level"], "normal")
                  self.assertTrue(needs_model)

              def test_academic_congress_without_actual_action_is_unrelated(self) -> None:
                  result, needs_model = rule_classify(
                      self.article(
                          "AI 활용 해양 국제범죄 대응 학술의회 개최",
                          "인공지능 활용사례를 공유하고 국제협력 방향을 논의한다.",
                          "해양경찰청",
                      ),
                      self.policy,
                  )
                  self.assertEqual(result["level"], "unrelated")
                  self.assertFalse(needs_model)

              def test_digital_transition_center_opening_is_important(self) -> None:
                  article = self.article(
                      "해양정보 디지털 전환 인프라센터 대한민국에 문 연다",
                      "디지털 전환 인프라센터가 대한민국에 문을 연다.",
                      "해양수산부",
                  )
                  evidence = classification_evidence(article, self.policy)
                  result, needs_model = rule_classify(article, self.policy)
                  self.assertTrue(evidence["condition_b"])
                  self.assertEqual(result["level"], "important")
                  self.assertTrue(needs_model)

              def test_ai_infrastructure_link_without_action_is_not_important(self) -> None:
                  article = self.article(
                      "국산 NPU, 엔비디아 시스템과 연계해 글로벌 AI 인프라 시장 진출 길 연다",
                      "관련 보도자료의 자세한 내용은 첨부파일을 참고한다.",
                      "과학기술정보통신부",
                  )
                  evidence = classification_evidence(article, self.policy)
                  result, _ = rule_classify(article, self.policy)
                  self.assertFalse(evidence["condition_b"])
                  self.assertNotIn(result["level"], {"critical", "important"})

          ''')
          marker = '    def test_model_critical_without_a_is_demoted_to_important'
          if 'def test_briefing_title_with_targeted_build_is_capped_at_normal' not in text:
              text = text.replace(marker, extra + marker)
          test_path.write_text(text, encoding='utf-8')
          PY

      - name: 전체 테스트 및 문법 검사
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile collector/*.py
          node --check docs/assets/app.js

      - name: 오늘 기존 중요 자료 재진단
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json

          from collector.classify_relevance import classification_evidence, constrain_model_result, load_policy, rule_classify

          policy = load_policy(Path('collector/relevance_policy.json'))
          payload = json.loads(Path('docs/data/2026/11/09/articles.json').read_text(encoding='utf-8'))
          counts = Counter()
          print('기존 중요 14건의 v1.2 상한 적용 결과')
          for article in payload.get('articles', []):
              current = article.get('ip_relevance', {})
              if current.get('level') not in {'critical', 'important'}:
                  continue
              guarded = constrain_model_result(article, current, policy)
              evidence = classification_evidence(article, policy)
              rule, _ = rule_classify(article, policy)
              counts[guarded['level']] += 1
              print(json.dumps({
                  'title': article.get('title'),
                  'guarded': guarded['level'],
                  'rule': rule['level'],
                  'B': evidence['condition_b'],
                  'event_cap': evidence['event_capped_normal'],
                  'event_only': evidence['event_discussion_only'],
                  'targets': evidence['targeted_action_targets'][:4],
                  'actions': evidence['targeted_actions'][:4],
              }, ensure_ascii=False))
          print('집계:', dict(counts))
          PY

      - name: 변경사항 저장 및 임시 워크플로 정리
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "policy-dashboard-bot"
          git config user.email "policy-dashboard-bot@users.noreply.github.com"
          git rm .github/workflows/refine-v12.yml
          git add collector/relevance_policy.json tests/test_relevance.py
          git commit -m "fix: 대상연결 구축·개소 표현과 행사 상한 정밀화"
          git push origin HEAD:fix/target-linked-b-event-cap-v12
