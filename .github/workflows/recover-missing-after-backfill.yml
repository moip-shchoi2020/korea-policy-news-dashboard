name: 전체 백필 후 누락일 정밀 복구

on:
  workflow_run:
    workflows:
      - "전체 누락기간 수집·Gemini 판정·배포"
    types:
      - completed

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: recover-missing-20260807-20261029
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 최신 main 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Gemini 키 확인
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_KEY || secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo "::error::GEMINI_KEY 또는 GEMINI_API_KEY가 등록되어 있지 않습니다."
            exit 1
          fi

      - name: 원문 건수와 저장 건수 대조
        env:
          CONNECT_TIMEOUT_SECONDS: "15"
          READ_TIMEOUT_SECONDS: "30"
          HTTP_RETRY_TOTAL: "4"
          HTTP_BACKOFF_FACTOR: "2"
          KOREA_MOBILE_FALLBACK: "true"
          KOREA_PREFERRED_HOST: "www.korea.kr"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          from datetime import date, timedelta
          from pathlib import Path

          from collector.collect import (
              DEFAULT_LIST_URL,
              create_session,
              parse_list_page,
              request_page,
          )

          start = date.fromisoformat('2026-08-07')
          end = date.fromisoformat('2026-10-29')
          data_dir = Path('docs/data')
          source_counts = {}
          recovery = []
          query_failures = []

          cursor = start
          while cursor <= end:
              day = cursor.isoformat()
              expected = None
              last_error = None
              for attempt in range(1, 4):
                  try:
                      session = create_session()
                      content = request_page(
                          session,
                          DEFAULT_LIST_URL,
                          params={
                              'pageIndex': '1',
                              'startDate': day,
                              'endDate': day,
                              'period': '',
                              'srchWord': '',
                              'repCode': '',
                              'repCodeType': '',
                          },
                      )
                      parsed = parse_list_page(content, cursor)
                      expected = parsed.total_count
                      if expected is None:
                          expected = parsed.candidate_count
                      break
                  except Exception as exc:
                      last_error = str(exc)
                      time.sleep(attempt * 3)

              if expected is None:
                  query_failures.append({'date': day, 'error': last_error})
                  cursor += timedelta(days=1)
                  continue

              source_counts[day] = int(expected)
              path = data_dir / cursor.strftime('%Y/%m/%d') / 'articles.json'
              stored = 0
              if path.exists():
                  try:
                      stored = len(json.loads(path.read_text(encoding='utf-8')).get('articles', []))
                  except Exception:
                      stored = 0

              if expected > stored:
                  recovery.append({'date': day, 'expected': int(expected), 'stored': stored})

              print(f'{day}: 원문 {expected}건 / 저장 {stored}건')
              cursor += timedelta(days=1)
              time.sleep(0.35)

          Path('/tmp/source_counts.json').write_text(
              json.dumps(source_counts, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          Path('/tmp/recovery_dates.json').write_text(
              json.dumps(recovery, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          Path('/tmp/query_failures.json').write_text(
              json.dumps(query_failures, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          with Path('/tmp/recovery_dates.txt').open('w', encoding='utf-8') as stream:
              for item in recovery:
                  stream.write(f"{item['date']} {item['expected']} {item['stored']}\n")

          print(f'재수집 대상: {len(recovery)}일')
          print(f'원문 조회 실패: {len(query_failures)}일')
          print(json.dumps(recovery, ensure_ascii=False, indent=2))
          if query_failures:
              print(json.dumps(query_failures, ensure_ascii=False, indent=2))
          PY

      - name: 누락·불완전 날짜 개별 재수집
        env:
          CONNECT_TIMEOUT_SECONDS: "20"
          READ_TIMEOUT_SECONDS: "45"
          HTTP_RETRY_TOTAL: "4"
          HTTP_BACKOFF_FACTOR: "2"
          KOREA_MOBILE_FALLBACK: "true"
          KOREA_PREFERRED_HOST: "www.korea.kr"
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "policy-dashboard-bot"
          git config user.email "policy-dashboard-bot@users.noreply.github.com"
          : > /tmp/unresolved_dates.txt
          recovered_since_push=0

          push_progress() {
            local label="$1"
            git add docs/data
            if git diff --cached --quiet; then
              return 0
            fi
            git commit -m "data: ${label} 날짜별 정밀 복구 [skip ci]"
            for push_attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                return 0
              fi
              git rebase --abort || true
              sleep $((push_attempt * 5))
            done
            echo "::error::복구 데이터 push 실패"
            return 1
          }

          while read -r day expected stored; do
            [[ -z "$day" ]] && continue
            echo "::group::${day} 재수집 (원문 ${expected}건 / 저장 ${stored}건)"
            success=false
            for attempt in 1 2 3 4; do
              echo "${day}: ${attempt}/4회차"
              if REQUEST_DELAY_SECONDS="0.45" DETAIL_WORKERS="2" \
                 python -u -m collector.collect \
                   --start-date "$day" \
                   --end-date "$day" \
                   --max-pages-per-day 20 \
                   --detail-workers 2 \
                   --request-delay 0.45 \
                   --require-records; then
                actual=$(python - "$day" <<'PY'
          import json
          import sys
          from datetime import date
          from pathlib import Path
          day = date.fromisoformat(sys.argv[1])
          path = Path('docs/data') / day.strftime('%Y/%m/%d') / 'articles.json'
          print(len(json.loads(path.read_text(encoding='utf-8')).get('articles', [])) if path.exists() else 0)
          PY
                )
                echo "${day}: 저장 ${actual}건"
                if (( actual >= expected )); then
                  success=true
                  break
                fi
              fi
              sleep $((attempt * 8))
            done

            if [[ "$success" == "true" ]]; then
              recovered_since_push=$((recovered_since_push + 1))
              if (( recovered_since_push >= 4 )); then
                push_progress "누락일 묶음"
                recovered_since_push=0
              fi
            else
              echo "$day $expected" >> /tmp/unresolved_dates.txt
              echo "::warning::${day} 재수집을 완료하지 못했습니다."
            fi
            echo "::endgroup::"
            sleep 3
          done < /tmp/recovery_dates.txt

          push_progress "누락일 최종 묶음"

      - name: Gemini 미판정·대체판정 재처리
        timeout-minutes: 150
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          GEMINI_MAX_ATTEMPTS: "8"
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "policy-dashboard-bot"
          git config user.email "policy-dashboard-bot@users.noreply.github.com"

          count_fallback() {
            python - <<'PY'
          import json
          from pathlib import Path
          count = 0
          for path in Path('docs/data').glob('[0-9][0-9][0-9][0-9]/[0-9][0-9]/[0-9][0-9]/articles.json'):
              payload = json.loads(path.read_text(encoding='utf-8'))
              count += sum(1 for article in payload.get('articles', []) if article.get('ip_relevance', {}).get('method') == 'rules-fallback')
          print(count)
          PY
          }

          clear_fallback() {
            python - <<'PY'
          import json
          from pathlib import Path
          changed = 0
          for path in Path('docs/data').glob('[0-9][0-9][0-9][0-9]/[0-9][0-9]/[0-9][0-9]/articles.json'):
              payload = json.loads(path.read_text(encoding='utf-8'))
              dirty = False
              for article in payload.get('articles', []):
                  if article.get('ip_relevance', {}).get('method') == 'rules-fallback':
                      article.pop('ip_relevance', None)
                      dirty = True
                      changed += 1
              if dirty:
                  path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'rules-fallback 초기화: {changed}건')
          PY
          }

          for pass in 1 2 3 4; do
            remaining=$(count_fallback)
            echo "Gemini 재처리 ${pass}/4 전 rules-fallback: ${remaining}건"
            clear_fallback
            python -u -m collector.classify_relevance_gemini \
              --model "$GEMINI_MODEL" \
              --batch-size 8 \
              --max-articles 5000 \
              --request-delay 10
            python -m collector.build_indexes

            git add docs/data
            if ! git diff --cached --quiet; then
              git commit -m "data: Gemini 전체 미판정 재처리 ${pass} [skip ci]"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi

            remaining=$(count_fallback)
            echo "Gemini 재처리 ${pass}/4 후 rules-fallback: ${remaining}건"
            [[ "$remaining" == "0" ]] && break
            sleep 30
          done

      - name: 원문 대비 최종 완전성 검증
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from datetime import date
          from pathlib import Path

          source_counts = json.loads(Path('/tmp/source_counts.json').read_text(encoding='utf-8'))
          incomplete = []
          zero_source_days = []
          for day, expected in sorted(source_counts.items()):
              parsed = date.fromisoformat(day)
              path = Path('docs/data') / parsed.strftime('%Y/%m/%d') / 'articles.json'
              stored = 0
              if path.exists():
                  stored = len(json.loads(path.read_text(encoding='utf-8')).get('articles', []))
              if expected == 0:
                  zero_source_days.append(day)
              elif stored < expected:
                  incomplete.append({'date': day, 'expected': expected, 'stored': stored})

          query_failures = json.loads(Path('/tmp/query_failures.json').read_text(encoding='utf-8'))
          unresolved_text = Path('/tmp/unresolved_dates.txt').read_text(encoding='utf-8').strip() if Path('/tmp/unresolved_dates.txt').exists() else ''

          methods = Counter()
          total = 0
          for path in Path('docs/data').glob('[0-9][0-9][0-9][0-9]/[0-9][0-9]/[0-9][0-9]/articles.json'):
              payload = json.loads(path.read_text(encoding='utf-8'))
              articles = payload.get('articles', [])
              total += len(articles)
              methods.update(article.get('ip_relevance', {}).get('method', 'unclassified') for article in articles)

          manifest = json.loads(Path('docs/data/manifest.json').read_text(encoding='utf-8'))
          print('원문 조회 실패:', query_failures)
          print('미완전 날짜:', incomplete)
          print('원문 0건 날짜:', zero_source_days)
          print('재수집 미해결 로그:', unresolved_text)
          print('판정 방식:', dict(sorted(methods.items())))
          print('manifest:', json.dumps(manifest, ensure_ascii=False, indent=2))

          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          summary.write_text(
              '## 날짜별 정밀 복구 결과\n\n'
              f'- 검증 기간: 2026-08-07 ~ 2026-10-29\n'
              f'- 원문 조회 실패: {len(query_failures)}일\n'
              f'- 원문 대비 미완전 날짜: {len(incomplete)}일\n'
              f'- 원문 0건 날짜: {len(zero_source_days)}일\n'
              f'- 전체 저장 기사: {total:,}건\n'
              f'- 판정 방식: `{dict(sorted(methods.items()))}`\n'
              f'- 최종 저장 날짜: {manifest.get("last_date")}\n'
              f'- 미완전 상세: `{incomplete}`\n',
              encoding='utf-8',
          )

          if query_failures:
              raise SystemExit(f'원문 조회 실패 날짜가 남았습니다: {query_failures}')
          if incomplete:
              raise SystemExit(f'원문 대비 미완전 날짜가 남았습니다: {incomplete}')
          if manifest.get('last_date') != '2026-10-29':
              raise SystemExit(f'최종 날짜가 2026-10-29가 아닙니다: {manifest.get("last_date")}')
          PY

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v6

      - name: Pages 배포 파일 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: recover
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
