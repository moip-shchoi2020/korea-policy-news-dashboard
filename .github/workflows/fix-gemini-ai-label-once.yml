name: Gemini AI 판정 표시 수정

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-gemini-ai-label-once.yml"

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Gemini 판정 표시 로직 수정
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/assets/app.js')
          text = path.read_text(encoding='utf-8')
          old = '  if (relevance.method === "github-models") return `AI 판정 ${percent}%`;'
          new = '  if (["github-models", "gemini-api", "openai-api"].includes(relevance.method)) return `AI 판정 ${percent}%`;'
          if old not in text:
              raise SystemExit('수정 대상 표시 로직을 찾지 못했습니다.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check docs/assets/app.js

      - name: 변경사항 반영
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "policy-dashboard-bot"
          git config user.email "policy-dashboard-bot@users.noreply.github.com"
          git add docs/assets/app.js
          git commit -m "fix: Gemini 결과를 AI 판정으로 표시"
          git push origin HEAD:main
