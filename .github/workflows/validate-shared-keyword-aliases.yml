name: 공용 키워드·유사어 검증

on:
  push:
    branches:
      - fix/shared-keyword-aliases
    paths:
      - "collector/**"
      - "docs/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/validate-shared-keyword-aliases.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6

      - name: Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Python 단위 테스트
        run: python -m unittest discover -s tests -v

      - name: Python·JavaScript 문법 검사
        run: |
          python -m py_compile collector/*.py
          node --check docs/assets/app.js
          node --check docs/assets/priority-visibility.js

      - name: 대시보드 유사어 동작 검증
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          global.normalizeDisplayText = (value) => String(value ?? '').replace(/\s+/g, ' ').trim();
          global.state = { config: JSON.parse(fs.readFileSync('docs/data/config.json', 'utf8')) };
          global.keywordMatches = (text, keyword) => {
            const source = normalizeDisplayText(text).toLocaleLowerCase('ko-KR');
            const target = normalizeDisplayText(keyword).toLocaleLowerCase('ko-KR');
            if (/^[a-z0-9+#._-]+$/i.test(keyword)) {
              const escaped = target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              return new RegExp(`(^|[^a-z0-9])${escaped}($|[^a-z0-9])`, 'i').test(source);
            }
            return source.includes(target);
          };
          global.articleMatches = () => [];

          vm.runInThisContext(fs.readFileSync('docs/assets/priority-visibility.js', 'utf8'));

          const assertions = [
            ['AI', '인공지능 기반 업무혁신', true],
            ['AI', 'LLM 기반 행정서비스', true],
            ['AI', '생성형 인공지능 도입', true],
            ['AI', 'chairman 회의', false],
            ['AX', '인공지능 전환 추진', true],
          ];
          for (const [keyword, text, expected] of assertions) {
            const actual = keywordMatches(text, keyword);
            if (actual !== expected) {
              throw new Error(`${keyword} / ${text}: expected ${expected}, got ${actual}`);
            }
          }
          console.log('대시보드 유사어 검증 통과');
          NODE
