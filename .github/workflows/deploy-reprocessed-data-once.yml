name: 재수행 데이터 GitHub Pages 일회성 배포

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-reprocessed-data-once.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 최신 main 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Pages 설정
        uses: actions/configure-pages@v6

      - name: Pages 파일 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
