name: 일회성 2026-07-30~2026-08-06 백필

run-name: 2026-07-30~2026-08-06 수집·판정

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-20260730-20260806.yml"

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: policy-dashboard-${{ github.repository }}-main
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Python 패키지 설치
        run: pip install -r requirements.txt

      - name: 기본 테스트
        run: |
          python -m unittest discover -s tests -v
          node --check docs/assets/app.js

      - name: AI 공급자 설정 확인
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::warning title=AI 키 미등록::OPENAI_API_KEY가 없어 신규 모델 검토 대상은 rules-fallback으로 저장합니다. 기존 정상 AI 판정은 보존합니다."
          else
            echo "OPENAI_API_KEY 확인 완료: 신규 후보를 gpt-4.1-mini로 판정합니다."
          fi

      - name: 2026-07-30부터 2026-08-06까지 보도자료 수집
        timeout-minutes: 30
        env:
          CONNECT_TIMEOUT_SECONDS: "15"
          READ_TIMEOUT_SECONDS: "30"
          HTTP_RETRY_TOTAL: "2"
          HTTP_BACKOFF_FACTOR: "1.5"
          KOREA_MOBILE_FALLBACK: "true"
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -euo pipefail
          python -u -m collector.collect \
            --start-date "2026-07-30" \
            --end-date "2026-08-06" \
            --continue-on-error \
            --detail-workers 3 \
            --max-pages-per-day 10

      - name: 요청 기간 분류용 임시 데이터 구성
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/backfill-data
          python - <<'PY'
          from datetime import date, timedelta
          from pathlib import Path
          import shutil

          start = date.fromisoformat("2026-07-30")
          end = date.fromisoformat("2026-08-06")
          current = start
          copied = 0
          while current <= end:
              source = Path("docs/data") / current.strftime("%Y/%m/%d") / "articles.json"
              if source.exists():
                  target = Path("/tmp/backfill-data") / current.strftime("%Y/%m/%d") / "articles.json"
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
                  copied += 1
              current += timedelta(days=1)
          if copied == 0:
              raise SystemExit("요청 기간에 분류할 articles.json이 없습니다.")
          print(f"분류 대상 날짜 파일: {copied}개")
          PY

      - name: 7월 29일 기준 연관도 판정
        timeout-minutes: 45
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -euo pipefail
          python -u -m collector.classify_relevance_openai \
            --data-dir /tmp/backfill-data \
            --model "gpt-4.1-mini" \
            --batch-size 3 \
            --max-articles 3000 \
            --request-delay 4.1

      - name: 판정 결과 반영
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil

          source_root = Path("/tmp/backfill-data")
          target_root = Path("docs/data")
          copied = 0
          for source in source_root.glob("[0-9][0-9][0-9][0-9]/[0-9][0-9]/[0-9][0-9]/articles.json"):
              target = target_root / source.relative_to(source_root)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              copied += 1
          print(f"판정 반영 날짜 파일: {copied}개")
          PY

      - name: 색인 재생성
        run: python -m collector.build_indexes

      - name: 결과 검증 및 요약
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from collections import Counter
          from datetime import date, timedelta
          from pathlib import Path

          print("### 2026-07-30~2026-08-06 백필 결과")
          start = date.fromisoformat("2026-07-30")
          end = date.fromisoformat("2026-08-06")
          current = start
          total = 0
          methods = Counter()
          levels = Counter()
          missing = []
          while current <= end:
              path = Path("docs/data") / current.strftime("%Y/%m/%d") / "articles.json"
              if not path.exists():
                  missing.append(current.isoformat())
                  print(f"- {current.isoformat()}: 파일 없음")
                  current += timedelta(days=1)
                  continue
              payload = json.loads(path.read_text(encoding="utf-8"))
              articles = payload.get("articles", [])
              print(f"- {current.isoformat()}: {len(articles)}건")
              total += len(articles)
              for article in articles:
                  relevance = article.get("ip_relevance", {})
                  methods[relevance.get("method", "unclassified")] += 1
                  levels[relevance.get("level", "unclassified")] += 1
              current += timedelta(days=1)
          print(f"\n- 기간 내 총 기사: {total}건")
          print(f"- 판정 방식: {dict(sorted(methods.items()))}")
          print(f"- 중요도: {dict(sorted(levels.items()))}")
          print(f"- 파일 없는 날짜: {missing or '없음'}")
          if methods.get("unclassified", 0):
              raise SystemExit("미분류 자료가 남아 있습니다.")
          PY

      - name: 데이터 저장 및 일회성 워크플로 제거
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "policy-dashboard-bot"
          git config user.email "policy-dashboard-bot@users.noreply.github.com"

          git add docs/data
          git rm .github/workflows/backfill-20260730-20260806.yml
          git status --short
          git commit -m "data: 2026-07-30부터 2026-08-06까지 보도자료 백필"

          for attempt in 1 2 3; do
            echo "원격 main 동기화 및 push 시도 ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "원격 main과 자동 rebase에 실패했습니다."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "백필 데이터 push 완료"
              exit 0
            fi
            sleep $((attempt * 3))
          done

          echo "3회 시도 후에도 push하지 못했습니다."
          exit 1
