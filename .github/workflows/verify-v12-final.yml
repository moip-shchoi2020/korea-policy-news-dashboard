name: v1.2 최종 회귀검증

on:
  push:
    branches:
      - fix/target-linked-b-event-cap-v12
    paths:
      - .github/workflows/verify-v12-final.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/target-linked-b-event-cap-v12
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 전체 회귀테스트
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile collector/*.py
          node --check docs/assets/app.js
      - name: 테스트 개수 확인
        run: |
          count=$(python -m unittest discover -s tests 2>&1 | sed -n 's/^Ran \([0-9][0-9]*\) tests.*/\1/p')
          echo "실행 테스트: ${count}건"
          test "${count}" -ge 40
      - name: 임시 워크플로 정리
        run: |
          git config user.name "policy-dashboard-bot"
          git config user.email "policy-dashboard-bot@users.noreply.github.com"
          git rm .github/workflows/verify-v12-final.yml
          git commit -m "chore: v1.2 최종 검증 워크플로 정리"
          git push origin HEAD:fix/target-linked-b-event-cap-v12
