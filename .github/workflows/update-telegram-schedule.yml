name: Telegram 발송 시각 수정본 생성

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-telegram-schedule.yml"

permissions:
  contents: read

actions:
  read: true

concurrency:
  group: update-telegram-schedule-artifact
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Telegram 발송 시각 수정본 생성
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/collect-and-deploy.yml')
          text = path.read_text(encoding='utf-8')

          expression_open = '$' + '{{'
          expression_close = '}}'
          old_title = (
              '          TELEGRAM_REPORT_TITLE: '
              + expression_open
              + " github.event.schedule == '17 8 * * *' && '08시 브리핑' || "
                "github.event.schedule == '17 16 * * *' && '16시 브리핑' || "
                "'수동 시험 발송' "
              + expression_close
          )
          new_title = (
              '          TELEGRAM_REPORT_TITLE: '
              + expression_open
              + " github.event.schedule == '17 11 * * *' && '11시 브리핑' || "
                "github.event.schedule == '17 16 * * *' && '16시 브리핑' || "
                "github.event.schedule == '17 19 * * *' && '19시 브리핑' || "
                "'수동 시험 발송' "
              + expression_close
          )

          replacements = [
              (
                  '    # 한국시간 매일 08:17, 11:17, 16:17, 19:17 실행\n    # 정각 직후 혼잡을 피하기 위해 17분으로 분산한다.',
                  '    # 한국시간 매일 08:17, 11:17, 16:17, 19:17 실행\n    # Telegram 브리핑은 11:17, 16:17, 19:17 실행에서 발송한다.\n    # 정각 직후 혼잡을 피하기 위해 17분으로 분산한다.',
              ),
              (
                  '            "17 8 * * *")  label="08:17 대시보드 갱신 + Telegram" ;;',
                  '            "17 8 * * *")  label="08:17 대시보드 갱신" ;;',
              ),
              (
                  '            "17 11 * * *") label="11:17 대시보드 갱신" ;;',
                  '            "17 11 * * *") label="11:17 대시보드 갱신 + Telegram" ;;',
              ),
              (
                  '            "17 19 * * *") label="19:17 대시보드 갱신" ;;',
                  '            "17 19 * * *") label="19:17 대시보드 갱신 + Telegram" ;;',
              ),
              (
                  "            (github.event.schedule == '17 8 * * *' || github.event.schedule == '17 16 * * *')",
                  "            (github.event.schedule == '17 11 * * *' || github.event.schedule == '17 16 * * *' || github.event.schedule == '17 19 * * *')",
              ),
              (old_title, new_title),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'교체 대상이 정확히 1개가 아닙니다({count}개): {old}')
              text = text.replace(old, new, 1)

          required = [
              '"17 8 * * *")  label="08:17 대시보드 갱신" ;;',
              '"17 11 * * *") label="11:17 대시보드 갱신 + Telegram" ;;',
              '"17 16 * * *") label="16:17 대시보드 갱신 + Telegram" ;;',
              '"17 19 * * *") label="19:17 대시보드 갱신 + Telegram" ;;',
              "            (github.event.schedule == '17 11 * * *' || github.event.schedule == '17 16 * * *' || github.event.schedule == '17 19 * * *')",
              "'11시 브리핑'",
              "'16시 브리핑'",
              "'19시 브리핑'",
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'수정 검증 실패: {item}')

          path.write_text(text, encoding='utf-8')
          PY

          echo "수정된 예약·발송 조건:"
          grep -nE '17 (8|11|16|19) \* \* \*|TELEGRAM_REPORT_TITLE' .github/workflows/collect-and-deploy.yml

      - name: 수정본 업로드
        uses: actions/upload-artifact@v4
        with:
          name: collect-and-deploy-updated
          path: .github/workflows/collect-and-deploy.yml
          if-no-files-found: error
          retention-days: 1
