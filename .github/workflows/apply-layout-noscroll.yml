name: 좌측 패널 무스크롤 레이아웃 일회성 적용

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-layout-noscroll.yml"

permissions:
  contents: write

concurrency:
  group: apply-layout-noscroll
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: 무스크롤 규칙 병합 및 캐시 버전 갱신
        shell: bash
        run: |
          set -euo pipefail
          marker="Desktop no-scroll refinement"
          if ! grep -Fq "$marker" docs/assets/layout-fhd.css; then
            printf '\n' >> docs/assets/layout-fhd.css
            cat docs/assets/layout-fhd-noscroll.css >> docs/assets/layout-fhd.css
          fi
          sed -i -E 's#assets/layout-fhd\.css\?v=[^" ]+#assets/layout-fhd.css?v=20261031-2#' docs/index.html
          rm -f docs/assets/layout-fhd-noscroll.css
          rm -f .github/workflows/apply-layout-noscroll.yml

      - name: 변경사항 검증
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "overflow: hidden !important" docs/assets/layout-fhd.css
          grep -Fq "layout-fhd.css?v=20261031-2" docs/index.html
          node --check docs/assets/app.js

      - name: main 반영
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "policy-dashboard-bot"
          git config user.email "policy-dashboard-bot@users.noreply.github.com"
          git add docs/assets/layout-fhd.css docs/index.html
          git add -u docs/assets/layout-fhd-noscroll.css .github/workflows/apply-layout-noscroll.yml
          git commit -m "fix: 좌측 패널 스크롤 제거 및 달력 높이 자동 분할"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
