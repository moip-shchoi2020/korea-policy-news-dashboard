name: Gemini API 전환 검증

on:
  push:
    branches:
      - feature/gemini-api

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6

      - name: Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Python 패키지 설치
        run: pip install -r requirements.txt

      - name: Python 단위 테스트
        run: python -m unittest discover -s tests -v

      - name: Python 문법 검사
        run: python -m py_compile collector/*.py

      - name: JavaScript 문법 검사
        run: node --check docs/assets/app.js
