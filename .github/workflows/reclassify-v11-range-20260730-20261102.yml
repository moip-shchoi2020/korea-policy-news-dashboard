name: v1.1 기준 2026-07-30~11-02 재분류

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reclassify-v11-range-20260730-20261102.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: policy-dashboard-v11-range-20260730-20261102
  cancel-in-progress: false

jobs:
  reclassify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      START_DATE: "2026-07-30"
      END_DATE: "2026-11-02"
      POLICY_VERSION: "ip-office-relevance-v1.1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_KEY || secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
      GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_MAX_ATTEMPTS: "5"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 실행 전 검증
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GEMINI_API_KEY" ]] || { echo "GEMINI_KEY 또는 GEMINI_API_KEY가 없습니다."; exit 1; }
          python -m unittest discover -s tests -v
          python -m py_compile collector/*.py
          python - <<'PY'
          import json, os
          from datetime import date, timedelta
          from pathlib import Path

          policy = json.loads(Path('collector/relevance_policy.json').read_text(encoding='utf-8'))
          expected = os.environ['POLICY_VERSION']
          if policy.get('prompt_version') != expected:
              raise SystemExit(f"정책 버전 불일치: {policy.get('prompt_version')} != {expected}")

          start = date.fromisoformat(os.environ['START_DATE'])
          end = date.fromisoformat(os.environ['END_DATE'])
          missing = []
          total = 0
          current = start
          while current <= end:
              path = Path(f'docs/data/{current:%Y/%m/%d}/articles.json')
              if not path.exists():
                  missing.append(current.isoformat())
              else:
                  payload = json.loads(path.read_text(encoding='utf-8'))
                  total += len(payload.get('articles', []))
              current += timedelta(days=1)
          if missing:
              raise SystemExit('날짜 파일 누락: ' + ', '.join(missing))
          print(f'대상 기간 파일 검증 완료: {(end-start).days+1}일, 기사 {total}건')
          PY

      - name: 일주일 단위 Gemini 재분류 및 운영 데이터 병합
        timeout-minutes: 210
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import shutil
          import subprocess
          import sys
          from collections import Counter
          from datetime import date, datetime, timedelta
          from pathlib import Path

          START = date.fromisoformat(os.environ['START_DATE'])
          END = date.fromisoformat(os.environ['END_DATE'])
          POLICY_VERSION = os.environ['POLICY_VERSION']
          PRIMARY_MODEL = os.environ['GEMINI_MODEL']
          FALLBACK_MODEL = os.environ['GEMINI_FALLBACK_MODEL']
          SOURCE_ROOT = Path('docs/data')
          WORK_ROOT = Path('/tmp/reclass-v11-range')
          FALLBACK_ROOT = Path('/tmp/reclass-v11-fallback')
          VALID_LEVELS = {'critical', 'important', 'normal', 'unrelated'}

          def article_path(root: Path, day: date) -> Path:
              return root / f'{day:%Y/%m/%d}' / 'articles.json'

          def copy_week(start: date, end: date) -> int:
              shutil.rmtree(WORK_ROOT, ignore_errors=True)
              count = 0
              current = start
              while current <= end:
                  source = article_path(SOURCE_ROOT, current)
                  target = article_path(WORK_ROOT, current)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
                  payload = json.loads(source.read_text(encoding='utf-8'))
                  count += len(payload.get('articles', []))
                  current += timedelta(days=1)
              return count

          def run_classifier(root: Path, model: str, require_ai: bool = False) -> None:
              command = [
                  sys.executable,
                  '-u',
                  '-m',
                  'collector.classify_relevance_gemini',
                  '--data-dir',
                  str(root),
                  '--model',
                  model,
                  '--batch-size',
                  '10',
                  '--max-articles',
                  '2500',
                  '--request-delay',
                  '3',
                  '--force',
              ]
              if require_ai:
                  command.append('--require-ai')
              subprocess.run(command, check=True, env=os.environ.copy())

          def extract_fallback() -> int:
              shutil.rmtree(FALLBACK_ROOT, ignore_errors=True)
              count = 0
              for source in WORK_ROOT.glob('[0-9][0-9][0-9][0-9]/[0-9][0-9]/[0-9][0-9]/articles.json'):
                  payload = json.loads(source.read_text(encoding='utf-8'))
                  articles = []
                  for article in payload.get('articles', []):
                      if article.get('ip_relevance', {}).get('method') == 'rules-fallback':
                          copied = dict(article)
                          copied.pop('ip_relevance', None)
                          articles.append(copied)
                  if articles:
                      target = FALLBACK_ROOT / source.relative_to(WORK_ROOT)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_text(
                          json.dumps(
                              {
                                  'schema_version': 2,
                                  'date': payload.get('date'),
                                  'articles': articles,
                              },
                              ensure_ascii=False,
                              indent=2,
                          ) + '\n',
                          encoding='utf-8',
                      )
                      count += len(articles)
              return count

          def merge_fallback() -> int:
              updated = 0
              for source in FALLBACK_ROOT.glob('[0-9][0-9][0-9][0-9]/[0-9][0-9]/[0-9][0-9]/articles.json'):
                  target = WORK_ROOT / source.relative_to(FALLBACK_ROOT)
                  source_payload = json.loads(source.read_text(encoding='utf-8'))
                  target_payload = json.loads(target.read_text(encoding='utf-8'))
                  results = {
                      str(article.get('id')): article.get('ip_relevance')
                      for article in source_payload.get('articles', [])
                      if isinstance(article.get('ip_relevance'), dict)
                  }
                  for article in target_payload.get('articles', []):
                      result = results.get(str(article.get('id')))
                      if result and result.get('method') == 'gemini-api':
                          article['ip_relevance'] = result
                          updated += 1
                  target_payload['classification_prompt_version'] = POLICY_VERSION
                  target_payload['classification_updated_at'] = source_payload.get('classification_updated_at')
                  target.write_text(
                      json.dumps(target_payload, ensure_ascii=False, indent=2) + '\n',
                      encoding='utf-8',
                  )
              return updated

          def verify_and_merge_week(start: date, end: date) -> tuple[int, Counter[str], Counter[str]]:
              article_count = 0
              levels: Counter[str] = Counter()
              methods: Counter[str] = Counter()
              current = start
              while current <= end:
                  source_path = article_path(WORK_ROOT, current)
                  target_path = article_path(SOURCE_ROOT, current)
                  source_payload = json.loads(source_path.read_text(encoding='utf-8'))
                  target_payload = json.loads(target_path.read_text(encoding='utf-8'))
                  results = {
                      str(article.get('id')): article.get('ip_relevance')
                      for article in source_payload.get('articles', [])
                      if isinstance(article, dict) and isinstance(article.get('ip_relevance'), dict)
                  }
                  target_articles = target_payload.get('articles', [])
                  if len(results) != len(target_articles):
                      raise RuntimeError(
                          f'{current}: 결과 {len(results)}건 / 원문 {len(target_articles)}건으로 일치하지 않습니다.'
                      )
                  for article in target_articles:
                      article_id = str(article.get('id'))
                      result = results.get(article_id)
                      if result is None:
                          raise RuntimeError(f'{current}: {article_id} 분류 결과 누락')
                      level = str(result.get('level'))
                      method = str(result.get('method'))
                      version = str(result.get('prompt_version'))
                      if level not in VALID_LEVELS:
                          raise RuntimeError(f'{current}: {article_id} 잘못된 등급 {level}')
                      if method in {'rules-fallback', 'unclassified', ''}:
                          raise RuntimeError(f'{current}: {article_id} 미완료 판정 방식 {method}')
                      if version != POLICY_VERSION:
                          raise RuntimeError(f'{current}: {article_id} 정책 버전 {version}')
                      article['ip_relevance'] = result
                      levels[level] += 1
                      methods[method] += 1
                      article_count += 1

                  target_payload['classification_prompt_version'] = POLICY_VERSION
                  target_payload['classification_updated_at'] = source_payload.get(
                      'classification_updated_at', datetime.now().astimezone().isoformat(timespec='seconds')
                  )
                  target_payload['relevance_counts'] = dict(
                      Counter(
                          str(article.get('ip_relevance', {}).get('level', 'unclassified'))
                          for article in target_articles
                      )
                  )
                  target_path.write_text(
                      json.dumps(target_payload, ensure_ascii=False, indent=2) + '\n',
                      encoding='utf-8',
                  )
                  current += timedelta(days=1)
              return article_count, levels, methods

          overall_levels: Counter[str] = Counter()
          overall_methods: Counter[str] = Counter()
          overall_articles = 0
          processed_weeks = 0
          cursor = START

          while cursor <= END:
              week_end = min(cursor + timedelta(days=6), END)
              source_count = copy_week(cursor, week_end)
              print(f'\n=== {cursor}~{week_end}: 원문 {source_count}건 재분류 ===', flush=True)

              run_classifier(WORK_ROOT, PRIMARY_MODEL)
              fallback_count = extract_fallback()
              if fallback_count:
                  print(
                      f'기본 모델 미완료 {fallback_count}건을 {FALLBACK_MODEL}로 재시도합니다.',
                      flush=True,
                  )
                  run_classifier(FALLBACK_ROOT, FALLBACK_MODEL, require_ai=True)
                  merged = merge_fallback()
                  print(f'대체 모델 정상 결과 병합: {merged}/{fallback_count}건', flush=True)
                  if merged != fallback_count:
                      raise RuntimeError(
                          f'{cursor}~{week_end}: 대체 모델 병합이 완료되지 않았습니다.'
                      )

              article_count, levels, methods = verify_and_merge_week(cursor, week_end)
              print(
                  f'{cursor}~{week_end} 완료: {article_count}건 · 등급 {dict(levels)} · 방식 {dict(methods)}',
                  flush=True,
              )
              if article_count != source_count:
                  raise RuntimeError(
                      f'{cursor}~{week_end}: 원문 {source_count}건과 병합 {article_count}건 불일치'
                  )
              overall_articles += article_count
              overall_levels.update(levels)
              overall_methods.update(methods)
              processed_weeks += 1
              cursor = week_end + timedelta(days=1)

          summary = (
              '# v1.1 기간 재분류 결과\n\n'
              f'- 기간: {START}~{END}\n'
              f'- 일수: {(END-START).days+1}일\n'
              f'- 주차 묶음: {processed_weeks}개\n'
              f'- 기사: {overall_articles}건\n'
              f'- 중요도: {dict(overall_levels)}\n'
              f'- 판정 방식: {dict(overall_methods)}\n'
              f'- 정책 버전: {POLICY_VERSION}\n'
          )
          Path('/tmp/reclass-v11-summary.md').write_text(summary, encoding='utf-8')
          print('\n' + summary, flush=True)
          PY

      - name: 전체 색인 재생성 및 기간 최종 검증
        run: |
          set -euo pipefail
          python -m collector.build_indexes
          python - <<'PY'
          import json, os
          from collections import Counter
          from datetime import date, timedelta
          from pathlib import Path

          start = date.fromisoformat(os.environ['START_DATE'])
          end = date.fromisoformat(os.environ['END_DATE'])
          version = os.environ['POLICY_VERSION']
          levels = Counter()
          methods = Counter()
          versions = Counter()
          count = 0
          current = start
          while current <= end:
              path = Path(f'docs/data/{current:%Y/%m/%d}/articles.json')
              payload = json.loads(path.read_text(encoding='utf-8'))
              if payload.get('classification_prompt_version') != version and payload.get('articles'):
                  raise SystemExit(f'{current}: 일별 정책 버전 불일치')
              for article in payload.get('articles', []):
                  relevance = article.get('ip_relevance', {})
                  levels[str(relevance.get('level', 'unclassified'))] += 1
                  methods[str(relevance.get('method', 'unclassified'))] += 1
                  versions[str(relevance.get('prompt_version', 'missing'))] += 1
                  count += 1
              current += timedelta(days=1)

          if set(versions) != {version}:
              raise SystemExit(f'정책 버전 혼재: {dict(versions)}')
          if methods.get('rules-fallback') or methods.get('unclassified'):
              raise SystemExit(f'미완료 판정 존재: {dict(methods)}')
          if levels.get('unclassified'):
              raise SystemExit(f'미분류 존재: {dict(levels)}')
          print(f'최종 검증 완료: {count}건 · 중요도 {dict(levels)} · 방식 {dict(methods)}')
          with Path('/tmp/reclass-v11-summary.md').open('a', encoding='utf-8') as handle:
              handle.write(f'- 최종 검증 기사: {count}건\n')
              handle.write(f'- 최종 중요도: {dict(levels)}\n')
              handle.write(f'- 최종 판정 방식: {dict(methods)}\n')
          PY
          cat /tmp/reclass-v11-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 변경 데이터 반영 및 일회성 워크플로 정리
        run: |
          set -euo pipefail
          rm -f .github/workflows/reclassify-v11-range-20260730-20261102.yml
          git config user.name "policy-dashboard-bot"
          git config user.email "policy-dashboard-bot@users.noreply.github.com"
          git add docs/data .github/workflows/reclassify-v11-range-20260730-20261102.yml
          if git diff --cached --quiet; then
            echo "반영할 변경이 없습니다."
            exit 0
          fi
          git commit -m "data: 2026-07-30~11-02 v1.1 기준 재분류"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v6

      - name: Pages 배포 파일 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: reclassify
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
